version: '3'

services:
  mysql-db:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "%" # allow root login from any host
      MYSQL_ROOT_PASSWORD: root
      MYSQL_HOST: mysql-db
      MYSQL_DATABASE: arena_hub
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASS}
    volumes:
      - ./dump/:/docker-entrypoint-initdb.d/
      - db_data:/var/lib/mysql
    command: [ "mysqld", "--wait-timeout=28800", "--lower_case_table_names=1", "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION" ]
    ports:
      - 3306:3306
    networks:
      - arena_dev

  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    environment:
      REDIS_PASS: ${REDIS_PASS}
    volumes:
      - ./redis.conf:/etc/redis/redis.conf
    command: [ "redis-server", "/etc/redis/redis.conf" ]
    ports:
      - 6379:6379
    networks:
      - arena_dev

  akita:
    container_name: akita
    image: akitasoftware/cli:latest
    depends_on:
      - java-app
    environment:
      - AKITA_API_KEY_ID=${AKITA_API_KEY_ID}
      - AKITA_API_KEY_SECRET=${AKITA_API_KEY_SECRET}
    network_mode: "service:java-app"
    entrypoint: /akita apidump --service local-hub

  mvn-migrations:
    image: maven
    platform: linux/amd64
    command:
      - "sh"
      - "-c"
      - "mvn compile && mvn liquibase:update -Dliquibase.url=jdbc:mysql://mysql-db:3306/arena_hub"
    networks:
      - arena_dev
    depends_on:
      - mysql-db
    volumes:
      - ../guide-core-java/code/guidecore-server/:/usr/src/mymaven
    working_dir: /usr/src/mymaven

  java-app:
    image: arena-be-java:2.1
    platform: linux/amd64
    build:
      context: ../guide-core-java/code/guidecore-server
      dockerfile: ./Dockerfile
    container_name: arena-java-app
    # restart: unless-stopped
    ports:
      - 9999:9999
    depends_on:
      - mysql-db
      - redis
      - pdp
    networks:
      - arena_dev
    environment:
      START_ENVIRONMENT: environmentVars
      GUIDE_API_PORT: '9999'
      REDIS_HOST: redis
      REDIS_PASS: ${REDIS_PASS}
      REDIS_PORT: '6379'
      REDIS_SSL: 'false'
      MYSQL_HOST: mysql-db
      MYSQL_USER: user
      MYSQL_PASS: ${MYSQL_PASS}
      MYSQL_DB_NAME: arena_hub
      MYSQL_PORT: '3306'
      MYSQL_SSL: 'false'
      PERMIT_LICENSE_KEY: ${PERMIT_LICENSE_KEY}
      GUIDE_USER_STORE_PRIVATE_KEY: ${GUIDE_USER_STORE_PRIVATE_KEY}
      AWS_ROLE_SESSION_NAME: S3Upload
      AWS_S3_BUCKET: bucket name
      AWS_S3_REGION: eu-west-2
      AWS_IAM_ROLE: iam role
      GUIDE_USER_STORE_DOMAIN: stage.store.demoguide.xyz
      GUIDE_USER_STORE_KEY_PAIR_ID: ${GUIDE_USER_STORE_KEY_PAIR_ID}
      PDP_API_KEY: ${PDP_API_KEY}
      PDP_ADDRESS: http://localhost:7000
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

  pdp:
    image: permitio/pdp-v2:latest
    container_name: pdp
    restart: unless-stopped
    ports:
      - 7000:7766
    environment:
      PDP_API_KEY: ${PDP_API_KEY}
    networks:
      - arena_dev

networks:
  arena_dev:
    name: arena_dev
volumes:
  db_data: