# https://bitbucket-pipelines.atlassian.io/validator

# Bitbucket Pipelines configuration for building Java app with Docker

definitions:
  steps:
    - step: &build_and_test
        name: Build and Test
        image: maven:3.8.3
        caches:
          - maven
        script:
          - cd ./guide-core-java/guidecore-server
          - mvn -B -Dmaven.compiler.source=15 -Dmaven.compiler.target=15 clean test
        artifacts:
          - guide-core-java/guidecore-server/target/surefire-reports/**
        test:
          reports:
            junit:
              - guide-core-java/guidecore-server/target/surefire-reports/*.xml

    - step: &build_and_push
        name: Build an image, push to ECR
        image: maven:3.8.3
        caches:
          - maven
        #   - docker
        script:
          - export ARENA_BACKEND_VERSION=$(echo ${BITBUCKET_BRANCH}-${BITBUCKET_COMMIT::7} | tr '/_' '-')
          - cd ./guide-core-java/guidecore-migration
          - mvn package
          - cd ./../guidecore-server
          - mvn -B -Dmaven.compiler.source=15 -Dmaven.compiler.target=15 clean package -DskipTests
          - cd ../
          - |- 
            echo '{ "backend": "'${ARENA_BACKEND_VERSION}'" }' > guidecore-server/target/version.json
          - docker build --tag arena/api:$ARENA_BACKEND_VERSION --build-arg ARENA_BACKEND_VERSION=${ARENA_BACKEND_VERSION} .
          # Use the pipe to push the image to AWS ECR
          # https://bitbucket.org/atlassian/aws-ecr-push-image/src/master/
          - pipe: atlassian/aws-ecr-push-image:2.4.2
            variables:
                AWS_ACCESS_KEY_ID: $DEPLOYMENT_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $DEPLOYMENT_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
                IMAGE_NAME: arena/api
                TAGS: $(echo ${BITBUCKET_BRANCH}-${BITBUCKET_COMMIT::7} | tr '/_' '-')
        services:
          - docker

pipelines:
  branches:
    develop:
    - step:
        name: Activate build buttons
        script:
          - exit 0
    - step:
        <<: *build_and_test
    - step:
        <<: *build_and_push
        trigger: manual
    - step:
        name: Deploy to develop
        image: atlassian/default-image:4
        deployment: develop
        trigger: manual
        script:
          - .ci/deploy.sh --env develop

    # For feature/** branches: automatically compile and run tests. Optionally build container image, push it to ECR,
    # deploy an image to one of develop, staging-ec environments
    '{feature/**,bugfix/**}':
    - step:
        <<: *build_and_test
    - step:
        <<: *build_and_push
        trigger: manual
    - parallel:
        steps:
        - step:
            # We need this step because in Bitbucket first step must be automatic
            name: Activate deploy buttons
            script:
            - exit 0
        - step:
            name: Deploy to develop
            image: atlassian/default-image:4
            deployment: develop
            trigger: manual
            script:
              - .ci/deploy.sh --env develop
        - step:
            name: Deploy to staging-ec
            image: atlassian/default-image:4
            deployment: staging-ec
            trigger: manual
            script:
              - .ci/deploy.sh --env staging-ec

    # For release/**,hotfix/** branches: automatically compile, build container image, push it to ECR,
    # deploy an image to staging-ec environment. Optionally deploy an image to prod-ec environment
    '{release/**,hotfix/**}':
    - step: *build_and_test
    - step: *build_and_push
    - step:
        name: Deploy to staging-ec
        image: atlassian/default-image:4
        deployment: staging-ec
        script:
          - .ci/deploy.sh --env staging-ec
    - step:
        name: Deploy to prod-ec
        image: atlassian/default-image:4
        deployment: prod-ec
        trigger: manual
        script:
          - .ci/deploy.sh --env prod-ec
