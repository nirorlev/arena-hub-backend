  #   image: permitio/pdp-v2:latest
  #   ports:
  #     - 7000:7766
  #   environment:
  #     PDP_API_KEY: permit_key_f9miZvURiaE07363bRZl4FoEcSBttAcjx6v5HmSDtbJ7rEYWVxtDnDXI1AZnkNjONUkmQQKHPFn3CuE26KGBoW #${PDP_API_KEY}
  #     # PERMIT_LICENSE_KEY: ${PERMIT_LICENSE_KEY}
  #   networks:
